name: Build macOS Internal DMG

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Reuse the candidate DMG artifact from this run ID; leave empty to rebuild'
        required: false
        type: string
      skip_release_checks:
        description: 'Skip previously passed release checks when only acceptance tooling changed'
        required: false
        default: false
        type: boolean
      acceptance_resume_run_id:
        description: 'Carry forward completed UI baseline evidence from this run ID and resume at language persistence'
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-internal-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-macos-universal:
    name: Build universal macOS DMG
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2

      - run: corepack enable

      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

      # Yarn's file: dependency checksum includes host-specific archive metadata.
      # Refresh only those local vendor hashes on this disposable macOS checkout,
      # then prove the resulting graph is stable before any release checks run.
      - name: Install locked dependencies for macOS
        run: |
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          yarn install --immutable

      - name: Run release checks
        if: ${{ inputs.candidate_run_id == '' && inputs.skip_release_checks != true }}
        run: yarn check

      # The committed browser bundle is produced and audited by the Windows
      # release gate. Rebuilding it on macOS changes source-map path bytes even
      # though runtime code is equivalent, so verify the exact packaged copy.
      - name: Verify the vendored sidebar payload
        if: ${{ inputs.candidate_run_id == '' && inputs.skip_release_checks != true }}
        run: yarn workspace dsh-plugin-desktop verify:vendor-sidebar

      - name: Run real Electron sidebar continuity gate
        if: ${{ inputs.candidate_run_id == '' && inputs.skip_release_checks != true }}
        run: yarn workspace dsh-plugin-desktop verify:webview-continuity

      - name: Build package inputs without repeating passed checks
        if: ${{ inputs.candidate_run_id == '' && inputs.skip_release_checks == true }}
        run: yarn build

      - name: Build candidate DMG
        if: ${{ inputs.candidate_run_id == '' }}
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_SKIP_INSTALLED_ACCEPTANCE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: yarn workspace dsh-plugin-desktop dist:mac-internal

      - name: Record candidate source
        if: ${{ inputs.candidate_run_id == '' }}
        shell: bash
        run: echo "source_commit=${GITHUB_SHA}" > dsh-plugin-desktop/dist/mac-internal/CANDIDATE-MANIFEST.txt

      - name: Preserve reusable candidate DMG
        if: ${{ inputs.candidate_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Ruijie-Harness-macOS-candidate-${{ github.run_id }}
          path: |
            dsh-plugin-desktop/dist/mac-internal/*.dmg
            dsh-plugin-desktop/dist/mac-internal/CANDIDATE-MANIFEST.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Download reusable candidate DMG
        if: ${{ inputs.candidate_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          name: Ruijie-Harness-macOS-candidate-${{ inputs.candidate_run_id }}
          path: dsh-plugin-desktop/dist/mac-internal

      - name: Run installed-app acceptance
        env:
          DSH_MAC_ACCEPTANCE_RESUME_RUN_ID: ${{ inputs.acceptance_resume_run_id }}
        run: yarn workspace dsh-plugin-desktop accept:mac-installed dist/mac-internal

      - name: Upload macOS installed-app acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ruijie-Harness-macOS-acceptance-${{ github.run_id }}
          path: dsh-plugin-desktop/dist/mac-internal/acceptance-evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Give the distributable a stable name and checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          output_dir='dsh-plugin-desktop/dist/mac-internal'
          shopt -s nullglob
          dmgs=("$output_dir"/*.dmg)
          if [[ "${#dmgs[@]}" -ne 1 ]]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          artifact_name="Ruijie-Harness-${version}-macOS-universal"
          final_dmg="$output_dir/${artifact_name}.dmg"
          if [[ "${dmgs[0]}" != "$final_dmg" ]]; then
            mv "${dmgs[0]}" "$final_dmg"
          fi
          shasum -a 256 "$final_dmg" | tee "$final_dmg.sha256"
          {
            echo "product=Ruijie Harness"
            echo "version=$version"
            candidate_commit="$(sed -n 's/^source_commit=//p' "$output_dir/CANDIDATE-MANIFEST.txt")"
            echo "source_commit=${candidate_commit:-$GITHUB_SHA}"
            echo "acceptance_commit=${GITHUB_SHA}"
            echo "architecture=universal (x86_64 + arm64)"
            echo "signing=unsigned internal build"
            echo "notarization=disabled"
            echo "installed_acceptance=passed"
            echo "workflow=${GITHUB_WORKFLOW}"
          } > "$output_dir/BUILD-MANIFEST.txt"
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload installable macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            dsh-plugin-desktop/dist/mac-internal/*.dmg
            dsh-plugin-desktop/dist/mac-internal/*.sha256
            dsh-plugin-desktop/dist/mac-internal/BUILD-MANIFEST.txt
            dsh-plugin-desktop/dist/mac-internal/acceptance-evidence/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
